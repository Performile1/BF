    <script>
      // Prevent external Chrome extension disconnect messages from breaking the application preview
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        if (msg.indexOf('Could not establish connection') !== -1 || msg.indexOf('Receiving end does not exist') !== -1 || msg.indexOf('allowed') !== -1) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = (typeof reason === 'string' ? reason : (reason && reason.message)) || '';
        if (msg.indexOf('Could not establish connection') !== -1 || msg.indexOf('Receiving end does not exist') !== -1 || msg.indexOf('allowed') !== -1) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
        }
      }, true);
    </script>
